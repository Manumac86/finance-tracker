name: Lighthouse Performance Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run weekly on Sundays at 02:00 UTC
    - cron: '0 2 * * 0'

jobs:
  lighthouse-audit:
    name: Lighthouse Performance Audit
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli@0.12.x
        
      - name: Create Lighthouse CI config
        run: |
          cat > lighthouserc.js << 'EOF'
          module.exports = {
            ci: {
              collect: {
                url: [
                  'http://localhost:3000/en',
                  'http://localhost:3000/en/dashboard',
                  'http://localhost:3000/en/transactions',
                  'http://localhost:3000/en/budgets',
                  'http://localhost:3000/en/goals'
                ],
                startServerCommand: 'pnpm start',
                startServerReadyPattern: 'Ready',
                startServerReadyTimeout: 30000,
                numberOfRuns: 3
              },
              assert: {
                assertions: {
                  'categories:performance': ['warn', {minScore: 0.7}],
                  'categories:accessibility': ['error', {minScore: 0.9}],
                  'categories:best-practices': ['warn', {minScore: 0.85}],
                  'categories:seo': ['warn', {minScore: 0.8}]
                }
              },
              upload: {
                target: 'temporary-public-storage'
              }
            }
          };
          EOF
          
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          
      - name: Setup Node.js with cache
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        
      - name: Build application
        run: pnpm build
        env:
          NODE_ENV: production
          # Use test environment variables for Lighthouse
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          E2E_TEST_BYPASS: true
          
      - name: Run Lighthouse CI
        run: lhci autorun
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
          
      - name: Upload Lighthouse results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-results
          path: .lighthouseci/
          retention-days: 30
          
      - name: Comment Lighthouse results on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            
            // Find the latest Lighthouse report
            const reportsDir = '.lighthouseci';
            if (fs.existsSync(reportsDir)) {
              const reportFile = fs.readdirSync(reportsDir)
                .filter(f => f.endsWith('.json'))
                .sort()
                .pop();
                
              if (reportFile) {
                const report = JSON.parse(fs.readFileSync(path.join(reportsDir, reportFile)));
                const scores = report.categories;
                
                const comment = [
                  '## 🔍 Lighthouse Performance Audit',
                  '',
                  '| Category | Score | Status |',
                  '|----------|-------|--------|',
                  `| Performance | ${Math.round(scores.performance?.score * 100) || 0}% | ${scores.performance?.score >= 0.7 ? '✅' : '❌'} |`,
                  `| Accessibility | ${Math.round(scores.accessibility?.score * 100) || 0}% | ${scores.accessibility?.score >= 0.9 ? '✅' : '❌'} |`,
                  `| Best Practices | ${Math.round(scores['best-practices']?.score * 100) || 0}% | ${scores['best-practices']?.score >= 0.85 ? '✅' : '❌'} |`,
                  `| SEO | ${Math.round(scores.seo?.score * 100) || 0}% | ${scores.seo?.score >= 0.8 ? '✅' : '❌'} |`,
                  '',
                  `View detailed results in the [Lighthouse CI artifacts](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}).`
                ].join('\n');
                
                github.rest.issues.createComment({
                  issue_number: context.issue.number,
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  body: comment
                });
              }
            }